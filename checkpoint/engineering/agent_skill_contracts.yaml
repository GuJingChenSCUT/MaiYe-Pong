app_v1_implementation:
  source_of_truth: schemas/commerce.schema.json_versioned_V1_definitions_and_corresponding_implementations
  legacy_boundary:
    original_contract: 0.4-proposal
    old_role: slice_researcher
    rule: keep_legacy_entrypoints_and_tests_separate_no_implicit_field_coercion_or_inherited_pass
  http:
    prefix: /api/v1
    host: Python_stdlib_ThreadingHTTPServer_local_only_this_stop
    identity: server_validates_access_code_and_issues_HttpOnly_session
    actor_fields: [actor_id, tenant_id, role]
    roles: [buyer, merchant, operator]
    role_source: server_mapping_never_browser_selection_request_body_or_model_output
    mutations_require: [authenticated_session, resource_authorization, X_CSRF_Token, Idempotency_Key]
    processing_order: [authenticate, authorize_target_resource, validate_csrf, scoped_idempotency_lookup, version_check, business_mutation_and_response_persistence]
    idempotency_scope: tenant_actor_operation_with_target_resource_in_request_digest
    replay: same_key_same_request_returns_stored_result_before_stale_version_check
    key_conflict: same_key_different_request_returns_409
    stop: direct_backend_no_current_version_required
    merchant_operator_money_mutation: unavailable_this_stop
  persistence:
    app_owner: TaskStore
    kernel_owner: StageOneKernel
    database: same_caller_owned_sqlite_connection
    transaction: BEGIN_IMMEDIATE_covering_task_current_bindings_snapshot_authorization_operation_budget_and_dispatch_command
    kernel_internal_commit: forbidden
    installation: "StageOneKernel.install(conn) before outer transaction"
    durable_model_runs: persisted_run_with_fencing_lease_current_task_and_constraint_version_checks
    stale_model_result: reject_after_stop_version_change_or_lease_loss
    payment_recovery: never_use_model_lease_expiry_to_resend_a_claimed_payment
  fields:
    timestamps: UTC_epoch_integer_in_V1_human_readable_only_at_display_boundary
    task_projection: [task_id, state_version, constraints_version, status, draft, missing_fields, questions, run, comparison, proposal, operation, capabilities, events, metrics]
    draft: [text, product, purchase_quantity, cash_cap_minor, destination_ref, preference, requires_change_of_mind_return, latest_delivery_epoch]
    product: [brand, variant, net_content, unit, pack_count, packaging, origin, region_version]
    preference_values: [lowest_cost, fastest_delivery, easiest_returns]
    preference_rule: hard_gates_first_then_user_preference_missing_preference_explicitly_discloses_lowest_cost_default
    quote_money_binding: line_subtotal_minor_equals_unit_price_minor_times_purchase_quantity_pack_count_is_separate
    quote_fields: [quote_id, version, merchant_id, merchant_sku, purchase_quantity, unit_price_minor, line_subtotal_minor, product, fee_lines, discounts, currency, delivery, returns, payee_ref, payee_mapping_version, environment, provenance]
    calculation: [quote_id, quote_version, merchant_id, eligible, blockers, cash_minor, goods_minor, fees_minor, discount_minor, delivery, returns]
    snapshot: [snapshot_id, digest, task_id, constraints_version, fact_version, quote, draft, calculation, payee_ref, payee_mapping_version, expires_at, frozen_at, calculator_version]
    snapshot_binding: digest_of_canonical_frozen_body_snapshot_id_is_snap_prefix_plus_digest
    current_fact_binding: integer_quote_version_plus_quote_id_and_quote_digest_prevents_same_version_quote_substitution
    payee_mapping_version: positive_integer
    operation_projection: state_and_payment_status_represent_payment_order_status_is_independent
    stopped_mapping: V1_operation_state_STOPPED_is_pre_dispatch_control_stop_not_provider_payment_failure
    control_projection: stopped_boolean_and_stop_reason_map_to_control_semantics_not_new_provider_terminal_state
    current_order_status: NOT_CREATED_local_payment_does_not_create_real_merchant_order
    benefits: verified_instant_discounts_only_pending_rewards_separate_current_catalog_rewards_empty
  entrypoints:
    domain: [validate_task_v1, catalog_v1, evaluate_v1, rank_v1, freeze_v1]
    model: slice04.agent.run_task_v1
    model_handlers: app.task_tools.TaskTools_and_registry_v1
    kernel: [StageOneKernel.install, register_snapshot, approve, stop, claim, recover, inspect]
    kernel_signature_note: constructor_receives_conn_install_outside_transaction_mutations_inside_TaskStore_transaction
  current_model_tools:
    buyer_planner: [buyer_get_draft, buyer_propose_fields, buyer_request_clarification]
    offer_analyst: [facts_list_candidates, facts_get_quote, commerce_compare, facts_record_candidate, facts_refresh_quote]
    no_money_effects: true
    proposed_fields: missing_user_fields_only_with_original_text_span_and_no_authority_creation
    remaining_logical_roles: target_responsibilities_not_live_agent_claims
  model_evidence:
    live: actual_provider_call_required_missing_key_or_account_model_blocks_no_scripted_fallback
    scripted: explicit_local_workflow_exercise_not_online_proof
    injected_transport: test_transport_never_live_evidence
    replanning: new_facts_must_change_legal_action_no_forced_A_to_B_choice
    completion: proposed_research_result_never_equated_to_payment_or_order_success
  source_instruction_boundary:
    user_stop: trusted_authenticated_endpoint_is_authoritative
    merchant_or_knowledge_prompt: untrusted_data_cannot_approve_revoke_change_role_or_set_amounts
    safe_action: quarantine_instruction_validate_facts_or_rule_stop_without_fabricated_user_revocation
  acceptance: implementation_files_present_do_not_imply_integrated_tests_live_model_official_sandbox_or_deployment_pass

